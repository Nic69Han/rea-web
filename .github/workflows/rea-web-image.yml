name: REA web image

on:
  workflow_dispatch:
  push:
    tags: ["rea-web-v*"]

permissions:
  contents: read

concurrency:
  group: rea-web-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push ghcr.io image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      OWNER: ${{ github.repository_owner }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve image tags
        run: |
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/rea-web"
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#rea-web-v}"
          else
            version="sha-${SHA::12}"
          fi
          {
            echo "IMAGE=$image"
            echo "VERSION=$version"
          } >> "$GITHUB_ENV"
      - name: Log in to ghcr.io
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Build and push (with Ghidra)
        run: |
          docker buildx build --platform linux/amd64 --push \
            --file docker/rea-web/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SHA}" \
            --tag "${IMAGE}:${VERSION}" \
            .
          if [ "$REF_TYPE" = "tag" ]; then
            docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${VERSION}"
          fi
      - name: Build and push (slim, without Ghidra)
        run: |
          docker buildx build --platform linux/amd64 --push \
            --file docker/rea-web/Dockerfile \
            --build-arg WITH_GHIDRA=0 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SHA}" \
            --tag "${IMAGE}:${VERSION}-slim" \
            .
          if [ "$REF_TYPE" = "tag" ]; then
            docker buildx imagetools create --tag "${IMAGE}:slim" "${IMAGE}:${VERSION}-slim"
          fi
